<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ออกแบบสะพาน | ตอม่อและพื้นสะพาน 3D</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="bridge.css">

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="builder">
  <canvas id="preview" aria-label="ภาพ 3 มิติของสะพาน ลากเพื่อหมุน ถ่างนิ้วหรือเลื่อนล้อเมาส์เพื่อซูม"></canvas>

  <aside class="panel tall" aria-label="ค่าการออกแบบสะพาน">
    <header>
      <h1>ออกแบบสะพาน</h1>
      <p class="sub">เลือกประเภทสะพาน กำหนดตอม่อ คาน พื้น และช่วงสะพาน แล้วส่งไปวางบนแผนที่หรือดาวน์โหลดเป็นไฟล์</p>
    </header>

    <div class="kind-tabs" role="tablist" aria-label="ประเภทสะพาน">
      <button type="button" role="tab" id="tab-concrete" data-kind="concrete" aria-selected="true">สะพานคอนกรีต</button>
      <button type="button" role="tab" id="tab-steel" data-kind="steel" aria-selected="false" tabindex="-1">สะพานเหล็ก</button>
      <button type="button" role="tab" id="tab-overpass" data-kind="overpass" aria-selected="false" tabindex="-1">Overpass</button>
    </div>

    <figure class="section-view">
      <div id="section-svg"></div>
      <figcaption>หน้าตัดตอม่อ มองตามแนวสะพาน</figcaption>
    </figure>

    <figure class="section-view" id="profile-view" hidden>
      <div id="profile-svg"></div>
      <figcaption>รูปตัดตามยาว ระดับพื้นรายตอม่อ</figcaption>
    </figure>

    <form id="bridge-form" class="form" novalidate role="tabpanel" aria-labelledby="tab-concrete">
      <input type="hidden" name="bridgeKind" value="concrete">
      <label class="field">
        <span>ชื่อสะพาน</span>
        <input name="name" type="text" maxlength="60" autocomplete="off">
      </label>

      <fieldset class="group">
        <legend>ชนิดตอม่อ</legend>
        <div class="type-cards">
          <label class="type-card">
            <input type="radio" name="pierType" value="A">
            <svg viewBox="0 0 48 40" aria-hidden="true">
              <path d="M10 4h28v2c-6 0-10 2-11 8v24h-6V14c-1-6-5-8-11-8z" />
            </svg>
            <span><b>Type A</b> เสาเดี่ยวผายบน</span>
          </label>
          <label class="type-card">
            <input type="radio" name="pierType" value="B">
            <svg viewBox="0 0 48 40" aria-hidden="true">
              <rect x="4" y="6" width="40" height="8" />
              <rect x="10" y="14" width="6" height="24" />
              <rect x="32" y="14" width="6" height="24" />
            </svg>
            <span><b>Type B</b> เสาคู่</span>
          </label>
          <label class="type-card">
            <input type="radio" name="pierType" value="C">
            <svg viewBox="0 0 48 40" aria-hidden="true">
              <path d="M2 6h44v8h-4l-4 4v20h-5V14H11v24H6V18l-4-4z" />
            </svg>
            <span><b>Type C</b> พอร์ทัล</span>
          </label>
          <label class="type-card">
            <input type="radio" name="pierType" value="D">
            <svg viewBox="0 0 48 40" aria-hidden="true">
              <rect x="6" y="6" width="36" height="32" rx="4" />
            </svg>
            <span><b>Type D</b> ผนังทึบ</span>
          </label>
        </div>
      </fieldset>

      <div class="type-fields" id="a-fields" hidden>
        <div class="segmented" role="radiogroup" aria-label="หัวเสา Type A">
          <label><input type="radio" name="aTopMode" value="direct"><span>รับคานโดยตรง</span></label>
          <label><input type="radio" name="aTopMode" value="cap"><span>มีคานหัวเสา</span></label>
        </div>
        <div class="grid2">
          <label class="field">
            <span>ขนาดเสาโคน (ม.)</span>
            <input name="aBaseWidth" type="number" min="0" max="4" step="0.1" inputmode="decimal">
            <small>ขวางสะพาน, 0 = คำนวณให้</small>
          </label>
          <label class="field">
            <span>ความหนาเสา (ม.)</span>
            <input name="aThick" type="number" min="0" max="4" step="0.1" inputmode="decimal">
            <small>ตามแนวสะพาน, 0 = เท่าขนาดโคน</small>
          </label>
          <label class="field">
            <span>ขนาดเสาด้านบน (ม.)</span>
            <input name="aTopWidth" type="number" min="0" max="16" step="0.1" inputmode="decimal">
            <small>0 = คำนวณให้</small>
          </label>
          <label class="field">
            <span>ความลึกช่วงผาย (ม.)</span>
            <input name="aFlareDepth" type="number" min="0.5" max="3" step="0.1" inputmode="decimal">
            <small>วัดลงจากยอดเสา</small>
          </label>
        </div>
      </div>

      <div class="type-fields" id="d-fields" hidden>
        <div class="grid2">
          <label class="field">
            <span>ความหนาผนัง (ม.)</span>
            <input name="dThick" type="number" min="1" max="1.5" step="0.05" inputmode="decimal">
            <small>1.00–1.50 ม.</small>
          </label>
          <label class="field">
            <span>รัศมีขอบโค้ง (ม.)</span>
            <input name="dRadius" type="number" min="0.5" max="0.75" step="0.05" inputmode="decimal">
            <small>0.50–0.75 ม.</small>
          </label>
        </div>
      </div>

      <div class="field" id="portal-field" hidden>
        <label for="in-portal">ระยะห่างเสา Type C (ม.)</label>
        <input id="in-portal" name="portalSpan" type="number" min="6" max="40" step="0.5" inputmode="decimal" aria-describedby="hint-portal">
        <small id="hint-portal">วัดศูนย์กลางเสาถึงศูนย์กลางเสา ตั้งให้กว้างพอคร่อมถนนหรือทางด้านล่าง</small>
        <div class="chips" data-for="portalSpan" role="group" aria-label="ค่าระยะห่างเสาที่ใช้บ่อย"></div>
      </div>

      <fieldset class="group">
        <legend>คานรับพื้น</legend>
        <div class="segmented" role="radiogroup" aria-label="ชนิดคานรับพื้น">
          <label data-kinds="concrete overpass"><input type="radio" name="girderType" value="box"><span>คานกล่อง (เดิม)</span></label>
          <label data-kinds="steel"><input type="radio" name="girderType" value="truss"><span>โครงถัก</span></label>
          <label><input type="radio" name="girderType" value="igirder"><span id="ig-label">คาน I</span></label>
        </div>
      </fieldset>

      <div class="type-fields" id="ig-fields" hidden>
        <div class="grid2">
          <label class="field">
            <span>จำนวนคาน</span>
            <input name="girderCount" type="number" min="0" max="16" step="1" inputmode="numeric">
            <small id="hint-gcount">0 = คำนวณให้ (ห่าง ~2 ม.)</small>
          </label>
          <label class="field">
            <span>ปีกคานกว้าง (ม.)</span>
            <input name="girderWidth" type="number" min="0" max="2.5" step="0.05" inputmode="decimal">
            <small>0 = คำนวณให้</small>
          </label>
        </div>
        <div class="field">
          <span class="field-label">คานริม ด้านนอก</span>
          <div class="segmented" role="radiogroup" aria-label="รูปด้านนอกของคานริม">
            <label><input type="radio" name="edgeGirder" value="i"><span>เว้าเอว</span></label>
            <label><input type="radio" name="edgeGirder" value="solid"><span>ทึบเรียบ</span></label>
          </div>
        </div>
        <label class="field">
          <span>คานขวาง</span>
          <select name="diaphragm">
            <option value="none">ไม่มี</option>
            <option value="ends">ที่ปลายคาน</option>
            <option value="mid">ปลาย + กลางช่วง</option>
            <option value="third">ปลาย + ที่ 1/3</option>
            <option value="spacing">ทุกระยะที่กำหนด</option>
          </select>
        </label>
        <label class="field" id="dspacing-field">
          <span>ระยะคานขวาง (ม.)</span>
          <input name="diaphragmSpacing" type="number" min="3" max="30" step="0.5" inputmode="decimal">
        </label>
        <label class="field" id="slab-field">
          <span>ความหนาแผ่นพื้น (ม.)</span>
          <input name="slabThick" type="number" min="0.15" max="0.5" step="0.01" inputmode="decimal">
        </label>
      </div>

      <fieldset class="group" data-kinds="steel">
        <legend>พื้นสะพาน</legend>
        <div class="segmented" role="radiogroup" aria-label="ชนิดพื้นสะพานเหล็ก">
          <label><input type="radio" name="floorType" value="concrete"><span>พื้นคอนกรีต</span></label>
          <label><input type="radio" name="floorType" value="open"><span>โครงเหล็ก + หมอน</span></label>
        </div>
      </fieldset>

      <div class="type-fields" id="open-fields" hidden>
        <div class="field">
          <label for="in-sleeper">ระยะห่างหมอน (ม.)</label>
          <input id="in-sleeper" name="sleeperSpacing" type="number" min="0.4" max="1.2" step="0.05" inputmode="decimal">
          <div class="chips" data-for="sleeperSpacing" role="group" aria-label="ระยะห่างหมอนที่ใช้บ่อย"></div>
        </div>
        <div class="grid2">
          <label class="field">
            <span>ความยาวหมอน (ม.)</span>
            <input name="sleeperLength" type="number" min="1.6" max="3.2" step="0.05" inputmode="decimal">
          </label>
          <label class="field">
            <span>กว้าง × สูงหมอน (ม.)</span>
            <span class="row2">
              <input name="sleeperWidth" type="number" min="0.15" max="0.4" step="0.01" inputmode="decimal" aria-label="ความกว้างหมอน">
              <input name="sleeperHeight" type="number" min="0.1" max="0.3" step="0.01" inputmode="decimal" aria-label="ความสูงหมอน">
            </span>
          </label>
        </div>
        <label class="check">
          <input type="checkbox" name="walkway">
          <span>ทางเดินตรวจสภาพ (ตะแกรงเหล็กข้างราง)</span>
        </label>
      </div>

      <div class="grid2">
        <label class="field">
          <span id="deck-level-label">ระดับพื้นสะพาน (ม.)</span>
          <input name="deckLevel" type="number" min="2" max="40" step="0.5" inputmode="decimal">
        </label>
        <label class="field" id="depth-field">
          <span id="depth-label">ความลึกคาน (ม.)</span>
          <input name="girderDepth" type="number" min="0" max="6" step="0.1" inputmode="decimal" aria-describedby="hint-girder">
          <small id="hint-girder">0 = คำนวณให้</small>
        </label>
      </div>

      <div class="type-fields" data-kinds="overpass">
        <label class="field">
          <span>ระดับพื้นรายตอม่อ (ม.)</span>
          <input name="levels" type="text" autocomplete="off" placeholder="เช่น 1:5, 2:6.5, 4:5" aria-describedby="hint-levels">
          <small id="hint-levels">ต้นแรก = 1 · ต้นที่ไม่ระบุประมาณค่าจากต้นข้างเคียง · ว่าง = ระดับพื้นด้านบนทุกต้น</small>
        </label>
        <div class="grid2">
          <label class="field">
            <span>ช่องจราจร</span>
            <input name="lanes" type="number" min="0" max="6" step="1" inputmode="numeric">
            <small>0 = ไม่มีเส้นจราจร</small>
          </label>
          <label class="field">
            <span>ความชันสูงสุด (%)</span>
            <input name="maxGrade" type="number" min="1" max="15" step="0.5" inputmode="decimal">
            <small>เกินแล้วเตือน</small>
          </label>
        </div>
      </div>

      <div class="field">
        <label for="in-width">ความกว้างพื้นสะพาน (ม.)</label>
        <input id="in-width" name="deckWidth" type="number" min="4" max="20" step="0.5" inputmode="decimal">
        <div class="chips" data-for="deckWidth" role="group" aria-label="ค่าความกว้างที่ใช้บ่อย"></div>
      </div>

      <div class="grid2">
        <div class="field">
          <label for="in-span">ความยาว span (ม.)</label>
          <input id="in-span" name="spanLength" type="number" min="10" max="120" step="1" inputmode="decimal">
        </div>
        <label class="field">
          <span>จำนวน span</span>
          <input name="spanCount" type="number" min="1" max="30" step="1" inputmode="numeric">
        </label>
      </div>
      <div class="chips" data-for="spanLength" role="group" aria-label="ค่าความยาว span ที่ใช้บ่อย"></div>

      <label class="field">
        <span>ช่วงแบบกำหนดเอง</span>
        <input name="spanText" type="text" autocomplete="off" placeholder="เช่น 3x40 หรือ 100+75" aria-describedby="hint-spantext">
        <small id="hint-spantext">ว่าง = ความยาว span × จำนวน span · ช่วงไม่เท่ากันใช้ + คั่น (เหมือนช่อง Span ใน KML)</small>
      </label>

      <fieldset class="group">
        <legend>ราวสะพาน</legend>
        <div class="grid2">
          <label class="field">
            <span>จำนวนแนว</span>
            <select name="railings">
              <option value="0">ไม่มี</option>
              <option value="2">2 แนว (ขอบสองข้าง)</option>
              <option value="3">3 แนว (+ กลาง)</option>
              <option value="4">4 แนว (+ ราวด้านใน)</option>
              <option value="custom">กำหนดเอง</option>
            </select>
          </label>
          <label class="field">
            <span>ความสูงราว (ม.)</span>
            <input name="railingHeight" type="number" min="0.6" max="2" step="0.05" inputmode="decimal">
          </label>
        </div>
        <div class="segmented" role="radiogroup" aria-label="แบบราว">
          <label><input type="radio" name="railingStyle" value="wall"><span>กำแพงคอนกรีต</span></label>
          <label><input type="radio" name="railingStyle" value="steel"><span>ราวเหล็ก</span></label>
        </div>
        <label class="field" id="rinset-field">
          <span>ราวด้านใน ห่างจากขอบพื้น (ม.)</span>
          <input name="railingInset" type="number" min="0.3" max="3" step="0.05" inputmode="decimal">
          <small>วัดจากขอบพื้นถึงศูนย์กลางราวด้านใน ทั้งสองข้าง</small>
        </label>
        <label class="field" id="rlist-field">
          <span>ตำแหน่งราว (ม.)</span>
          <input name="railingList" type="text" autocomplete="off" placeholder="เช่น -6.4, -5.2, 0, 5.2, 6.4">
          <small>ระยะจากศูนย์กลางสะพาน ลบ = ซ้าย · คั่นด้วย ,</small>
        </label>
      </fieldset>

      <fieldset class="group">
        <legend>ตอม่อริม · ตอม่อรายต้น · มุมเฉียง</legend>
        <label class="check">
          <input type="checkbox" name="abutmentD">
          <span>ตอม่อริม (ต้นแรก/ต้นสุดท้าย) เป็นผนังทึบ Type D</span>
        </label>
        <div class="grid2">
          <label class="field">
            <span>กำแพงปีก (ม.)</span>
            <input name="wingWall" type="number" min="0" max="12" step="0.5" inputmode="decimal">
            <small>0 = ไม่มี · เฉพาะตอม่อริม Type D</small>
          </label>
          <label class="field" data-kinds="concrete overpass">
            <span>มุมเฉียง (องศา)</span>
            <input name="skew" type="number" min="-60" max="60" step="0.5" inputmode="decimal">
            <small>เหมือนช่อง Skew ใน KML</small>
          </label>
        </div>
        <label class="field">
          <span>ชนิดตอม่อรายต้น</span>
          <input name="piers" type="text" autocomplete="off" placeholder="เช่น 2:B, 3:C">
          <small>เลขต้นนับจากต้นแรก = 1 · ต้นที่ไม่ระบุใช้ชนิดตอม่อด้านบน</small>
        </label>
      </fieldset>

      <div class="grid2" data-kinds="concrete steel">
        <label class="field">
          <span>ทางรถไฟ</span>
          <select name="tracks">
            <option value="2">ทางคู่</option>
            <option value="1">ทางเดี่ยว</option>
            <option value="0">ไม่แสดงราง</option>
          </select>
        </label>
        <label class="field">
          <span>ขนาดราง</span>
          <select name="gauge">
            <option value="1">1.000 ม.</option>
            <option value="1.435">1.435 ม.</option>
          </select>
        </label>
      </div>
      <label class="field" data-kinds="concrete steel">
        <span>ระยะศูนย์กลางทางคู่ (ม.)</span>
        <input name="trackSpacing" type="number" min="3.5" max="6.5" step="0.1" inputmode="decimal">
      </label>
    </form>

    <dl id="summary" class="summary"></dl>
    <div id="messages" class="messages" role="status" aria-live="polite"></div>

    <div class="actions">
      <button id="btn-place" class="btn primary wide" type="button">วางบนแผนที่</button>
      <button id="btn-glb" class="btn" type="button">ดาวน์โหลด .glb</button>
      <button id="btn-json" class="btn" type="button">ดาวน์โหลด .json</button>
      <button id="btn-open" class="btn wide" type="button">เปิดไฟล์ .json</button>
      <input id="file-json" type="file" accept=".json,application/json" hidden>
    </div>

    <nav class="links" aria-label="หน้าอื่น">
      <a href="bridge-map.html">หน้าวางสะพาน</a>
      <a href="index.html">แผนที่ตัวอย่าง</a>
    </nav>
  </aside>

  <button id="btn-fit" class="btn fit-btn" type="button">จัดมุมกล้อง</button>

  <script src="bridge-gen.js"></script>
  <script type="module" src="bridge-builder.js"></script>
</body>
</html>
